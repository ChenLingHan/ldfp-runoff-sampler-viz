<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fdfefa">
<meta name="description" content="清样田守田块径流工作台，查看本田出流、低扰动留样和实验室检测。">
<title>清样田守 · 田块径流工作台</title>
<link rel="icon" href="./field-mark.svg" type="image/svg+xml">
<link rel="stylesheet" href="./dashboard.css?v=workbench-4">
<script defer src="./dashboard.js?v=workbench-4"></script>
<script type="module" src="./scene.js?v=workbench-4"></script>
</head>
<body>
<header class="top"><div class="shell">
  <div class="brand"><img src="./field-mark.svg" alt=""><div><h1>清样田守</h1><span>田块径流工作台</span></div></div>
  <div class="top-actions">
    <div class="status" id="status" role="status">方案预览 · 设备未接入</div>
    <button class="button fullscreen" id="fullscreen" type="button" hidden>全屏展示</button>
  </div>
</div></header>
<main class="shell dashboard">
    <section class="surface scene-card" aria-labelledby="scene-title">
      <div class="section-head scene-head">
        <div class="section-title"><span class="section-number" aria-hidden="true">01</span><h2 id="scene-title">田间布设与采样</h2></div>
        <div class="view-switch" role="group" aria-label="三维视角"><button type="button" data-view="field" aria-pressed="true" disabled>田块</button><button type="button" data-view="machine" aria-pressed="false" disabled>主机剖视</button><button type="button" data-view="valve" aria-pressed="false" disabled>阀组</button></div>
      </div>
      <div class="scene-viewport" id="scene-viewport"><img class="poster" src="./field-poster.webp" alt="本田低位量水段、近口阀组与留样主机"><span class="scene-legend" id="scene-state" hidden></span><span class="scene-help" id="scene-help">三维场景加载中</span></div>
      <div class="process" aria-label="留样阶段">
        <div class="process-head">
          <h3>采样流程</h3>
          <div class="process-actions">
            <button class="button" id="route-button" type="button" aria-haspopup="dialog" aria-controls="route-dialog" hidden>水路说明</button>
            <button class="button subtle" id="follow" type="button" hidden>跟随回放</button>
          </div>
        </div>
        <div class="steps" id="steps" role="group" aria-label="切换三维采样阶段"></div>
      </div>
    </section>
    <div class="monitoring">
      <section class="surface trend" aria-labelledby="trend-title">
        <div class="section-head">
          <div class="section-title"><span class="section-number" aria-hidden="true">02</span><h2 id="trend-title">降雨与本田出流</h2></div>
          <span class="stamp" id="timestamp">—</span>
        </div>
        <div class="metrics" aria-label="事件摘要">
          <div><span>累计降雨</span><strong id="rain">—</strong><small>mm</small></div>
          <div><span>瞬时流量</span><strong id="flow">—</strong><small>L/s</small></div>
          <div><span>累计出流</span><strong id="volume">—</strong><small>L</small></div>
        </div>
        <div class="plot">
          <div class="plot-legend" aria-hidden="true"><span class="rain-key">降雨</span><span class="flow-key">流量</span><span class="sample-key">留样时点</span></div>
          <svg id="chart" viewBox="0 0 480 174" role="img" aria-label="降雨、出流与留样时点"></svg>
        </div>
        <div class="timeline" id="timeline">
          <button class="button primary" id="play" type="button">回放事件</button>
          <input type="range" id="seek" aria-label="事件时段" min="0" max="0" value="0">
          <output id="cursor" for="seek">—</output>
          <select id="pace" aria-label="回放速率"><option value="guide">讲解</option><option value="fast">快览</option></select>
        </div>
      </section>
      <section class="surface sample" aria-labelledby="sample-heading">
        <div class="section-head">
          <div class="section-title"><span class="section-number" aria-hidden="true">03</span><h2 id="sample-heading">留样与检测</h2></div>
          <button class="button" id="csv" type="button">导出 CSV</button>
        </div>
        <section class="records" aria-labelledby="record-title">
          <div class="subhead records-head">
            <h3 id="record-title">样瓶</h3>
            <span class="sub" id="samples">—</span>
          </div>
          <div class="bottle-grid" id="bottles" role="group" aria-label="选择样瓶查看化验结果"></div>
        </section>
        <section class="results" aria-labelledby="results-heading">
          <div class="subhead"><h3 id="results-heading">合格区间的输出量</h3><span class="stamp" id="coverage">—</span></div>
          <div class="result-grid">
            <div><span>悬沙</span><strong id="mass-s">—</strong><small>g</small></div>
            <div><span>总氮</span><strong id="mass-n">—</strong><small>g</small></div>
            <div><span>总磷</span><strong id="mass-p">—</strong><small>g</small></div>
          </div>
        </section>
      </section>
    </div>
    <noscript>请启用 JavaScript 以浏览监测工作台</noscript>
</main>
<dialog class="detail-dialog" id="sample-dialog" aria-labelledby="sample-title">
  <header class="dialog-head">
    <h2 id="sample-title">样瓶明细</h2>
    <form method="dialog"><button class="button" type="submit" autofocus>关闭</button></form>
  </header>
  <p class="dialog-note" id="sample-note"></p>
  <section class="dialog-section" aria-labelledby="assay-title">
    <h3 id="assay-title">化验结果</h3>
    <p id="qc">—</p>
    <p id="probe-readings"></p>
  </section>
  <section class="dialog-section" id="sample-windows" aria-labelledby="windows-title" hidden>
    <h3 id="windows-title">取水时段</h3>
    <ol class="windows" id="source-windows"></ol>
  </section>
  <p class="dialog-note dialog-footer" id="plan"></p>
</dialog>
<dialog class="detail-dialog" id="route-dialog" aria-labelledby="stage">
  <header class="dialog-head">
    <h2 id="stage">水路说明</h2>
    <form method="dialog"><button class="button" type="submit" autofocus>关闭</button></form>
  </header>
  <p id="route"></p>
</dialog>
</body>
</html>
