<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f3f5ef">
<meta name="description" content="清样田守田块径流工作台，查看本田出流、低扰动留样和实验室检测。">
<title>清样田守 · 田块径流工作台</title>
<link rel="icon" href="./field-mark.svg" type="image/svg+xml">
<link rel="stylesheet" href="./dashboard.css?v=8f9a6c8">
<script defer src="./dashboard.js?v=8f9a6c8"></script>
<script type="module" src="./scene.js?v=8f9a6c8"></script>
</head>
<body>
<header class="top"><div class="shell">
  <div class="brand"><img src="./field-mark.svg" alt=""><div><h1>清样田守</h1><span>田块径流工作台</span></div></div>
  <div class="top-actions">
    <div class="status" id="status" role="status">方案预览 · 设备未接入</div>
    <button class="button" id="fullscreen" type="button" hidden>全屏展示</button>
  </div>
</div></header>
<main class="shell dashboard">
  <div class="workbench">
    <section class="surface scene-card" aria-labelledby="scene-title">
      <div class="section-head scene-head">
        <div><p class="eyebrow">02 / 留样设备</p><h2 id="scene-title">田间布设与采样路径</h2></div>
        <div class="view-switch" aria-label="三维视角"><button type="button" data-view="field" aria-pressed="true" disabled>田块</button><button type="button" data-view="machine" aria-pressed="false" disabled>主机剖视</button><button type="button" data-view="valve" aria-pressed="false" disabled>阀组</button></div>
      </div>
      <div class="scene-viewport" id="scene-viewport"><img class="poster" src="./field-poster.webp" alt="本田低位量水段、近口阀组与留样主机"><span class="scene-legend" id="scene-state" hidden></span><span class="scene-help" id="scene-help">三维场景加载中</span></div>
      <div class="process" aria-label="留样阶段">
        <div class="process-head"><strong>留样顺序</strong><button class="button subtle" id="follow" type="button">跟随回放</button></div>
        <div class="steps" id="steps"></div>
        <div class="route"><strong id="stage"></strong><span id="route"></span></div>
      </div>
    </section>
    <div class="monitoring">
      <section class="surface trend" aria-labelledby="trend-title">
        <div class="section-head">
          <div><p class="eyebrow">01 / 出口监测</p><h2 id="trend-title">降雨与本田出流</h2></div>
          <span class="stamp" id="timestamp">—</span>
        </div>
        <div class="metrics" aria-label="事件摘要">
          <div><span>累计降雨</span><strong id="rain">—</strong><small>mm</small></div>
          <div><span>瞬时流量</span><strong id="flow">—</strong><small>L/s</small></div>
          <div><span>累计出流</span><strong id="volume">—</strong><small>L</small></div>
        </div>
        <svg id="chart" viewBox="0 0 480 174" role="img" aria-label="降雨、出流与留样时点"></svg>
        <div class="timeline" id="timeline">
          <button class="button primary" id="play" type="button">回放事件</button>
          <input type="range" id="seek" aria-label="事件时段" min="0" max="0" value="0">
          <output id="cursor" for="seek">—</output>
          <select id="pace" aria-label="回放速率"><option value="guide">讲解</option><option value="fast">快览</option></select>
        </div>
      </section>
      <section class="surface sample" aria-labelledby="sample-heading">
        <div class="section-head">
          <div><p class="eyebrow">03 / 样品检测</p><h2 id="sample-heading">配对化验与区间输出</h2></div>
          <span class="stamp" id="coverage">—</span>
        </div>
        <div class="result-grid">
          <div><span>悬沙输出 · g</span><strong id="mass-s">—</strong></div>
          <div><span>总氮输出 · g</span><strong id="mass-n">—</strong></div>
          <div><span>总磷输出 · g</span><strong id="mass-p">—</strong></div>
        </div>
        <div class="detail">
          <div class="detail-line"><strong id="sample-title">—</strong><span id="sample-note"></span></div>
          <div class="detail-line"><span id="qc">—</span><span id="probe-readings"></span></div>
          <div id="source-windows" class="windows" aria-label="所选瓶取水时段"></div>
        </div>
      </section>
    </div>
  </div>
  <section class="surface records-card" aria-labelledby="record-title">
    <div class="section-head records-head">
      <div><h2 id="record-title">留样台账</h2><span class="sub" id="plan">—</span></div>
      <div class="record-actions"><span class="sub" id="samples">—</span><button class="button" id="csv" type="button">导出 CSV</button></div>
    </div>
    <div class="records">
      <div class="bottle-grid" id="bottles" aria-label="八个样瓶"></div>
    </div>
  </section>
  <footer class="foot"><span>本田低位出口 · 近口隔离排废 · 瓶号追溯</span><span>负荷仅汇总有对应水量且化验合格的区间</span></footer>
  <noscript>请启用 JavaScript 以浏览监测工作台</noscript>
</main>
</body>
</html>
